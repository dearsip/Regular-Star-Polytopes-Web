<!doctype html><meta charset="utf-8"><title>Compound mode validation</title><pre id="results">Running</pre>
<iframe id="app" width="640" height="640" src="../?model=StellatedIcositetrachoron&panel=hide&verify=1&inertia=0"></iframe>
<script type="module">
const out=document.querySelector('#results'),frame=document.querySelector('#app'),reports=[];
const tick=()=>new Promise(r=>requestAnimationFrame(r));
async function settled(){for(let i=0;i<180;i++){const s=frame.contentWindow.starViewer?.state;if(s&&!s.loading){await tick();await tick();if(s.shaderFailed)throw Error('Shader compilation failed');return;}await tick();}throw Error('Load timeout');}
function input(id,value){const e=frame.contentDocument.getElementById(id);e.value=value;e.dispatchEvent(new Event('input',{bubbles:true}));}
function changed(id,value){const e=frame.contentDocument.getElementById(id);e.value=value;e.dispatchEvent(new Event('change',{bubbles:true}));}
function pixels(){const c=frame.contentDocument.querySelector('#viewer'),g=c.getContext('webgl2'),p=new Uint8Array(c.width*c.height*4);g.readPixels(0,0,c.width,c.height,g.RGBA,g.UNSIGNED_BYTE,p);let colored=0,magenta=0;for(let i=0;i<p.length;i+=4){if(Math.max(p[i],p[i+1],p[i+2])-Math.min(p[i],p[i+1],p[i+2])>35)colored++;if(p[i]>220&&p[i+2]>220&&p[i+1]<30)magenta++;}if(magenta>20)throw Error('Error shader');return colored;}
try{
await new Promise(r=>frame.addEventListener('load',r,{once:true}));await settled();
const catalog=await(await fetch('../data/catalog.json')).json();
for(const m of catalog.models.filter(m=>m.compound)){
 changed('model',m.id);await tick();await settled();const meta=await(await fetch(`../data/${m.id}.json`)).json(),rows=[];
 for(const mode of ['full','single','radial','vertex','explosion']){
  frame.contentDocument.querySelector(`[data-mode="${mode}"]`).click();await settled();
  const groups=mode==='vertex'?meta.groups.length:1;
  for(let group=0;group<groups;group++){
   if(mode==='vertex'){changed('group',String(group));await settled();}
   if(mode==='explosion'){input('explosion','1');await settled();}
   let n=pixels();
   if(n<30){const toggle=frame.contentDocument.querySelector('#occlusion');toggle.checked=false;toggle.dispatchEvent(new Event('change',{bubbles:true}));await settled();n=pixels();toggle.checked=true;toggle.dispatchEvent(new Event('change',{bubbles:true}));}
   if(n<30)throw Error(`${m.id} ${mode} ${group}: blank rendering (${n})`);
   rows.push({mode,group,coloredPixels:n,triangles:frame.contentWindow.starViewer.state.triangles});
  }
 }
 reports.push({id:m.id,checks:rows});out.textContent=JSON.stringify(reports,null,2);
}
document.title='PASS: Compound modes';out.textContent=JSON.stringify(reports,null,2)+'\nALL PASS';
}catch(e){document.title='FAIL: Compound modes';out.textContent+='\nFAIL '+e.stack;}
</script>
